# Status check context is the job name `tripwire`, not this filename.
name: tripwire

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tripwire:
    name: tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZEROS=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE" ]; then
              echo "tripwire: missing pull_request.base.sha. Failing closed."
              exit 1
            fi
            echo "range=${PR_BASE}...HEAD" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZEROS" ]; then
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                echo "range=HEAD~1...HEAD" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
              else
                echo "range=" >> "$GITHUB_OUTPUT"
                echo "skip=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "range=${BEFORE}...HEAD" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tripwire: unsupported event. Failing closed."
            exit 1
          fi
      - if: steps.range.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: taipei49314/greenwash
          ref: v0.1.47
          path: vendor/greenwash
          persist-credentials: false
      - if: steps.range.outputs.skip != 'true'
        env:
          TRIPWIRE_RANGE: ${{ steps.range.outputs.range }}
        run: python scripts/ci_greenwash.py "$TRIPWIRE_RANGE"
